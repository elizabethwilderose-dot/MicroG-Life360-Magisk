name: shellcheck

on:
  push:
    branches: [main]
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - '**.sh'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch:

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint scripts/
        run: shellcheck --severity=warning scripts/*.sh

      # customize.sh runs inside Magisk, which provides ui_print, abort,
      # set_perm* and $MODPATH at runtime. SC2154 (referenced but not assigned)
      # is therefore expected and excluded.
      - name: Lint module/customize.sh
        run: shellcheck --severity=warning --exclude=SC2154 module/customize.sh
